<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Items Database - All Items (Dynamic)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: rgba(52, 73, 94, 0.7);
            border-radius: 8px;
            min-width: 120px;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #3498db;
        }

        .stat-label {
            font-size: 0.9em;
            color: #bdc3c7;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #34495e;
            color: white;
            font-size: 16px;
            min-width: 300px;
        }

        .search-box::placeholder {
            color: #95a5a6;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .pagination button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background: #34495e;
            color: white;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #2c3e50;
        }

        .pagination button.active {
            background: #3498db;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #95a5a6;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
            font-size: 1.2em;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .item-card {
            background: #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            background: #34495e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #95a5a6;
        }

        .item-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #ecf0f1;
        }

        .item-id {
            color: #95a5a6;
            font-size: 0.9em;
        }

        .item-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
        }

        .item-detail {
            display: flex;
            justify-content: space-between;
        }

        .item-detail-label {
            color: #95a5a6;
        }

        .item-detail-value {
            color: #ecf0f1;
            font-weight: 500;
        }

        .item-examine {
            margin-top: 15px;
            padding: 10px;
            background: #34495e;
            border-radius: 5px;
            font-style: italic;
            color: #bdc3c7;
            font-size: 0.9em;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OSRS Items Database</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalItems">-</div>
                    <div class="stat-label">Total Items</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="currentPage">-</div>
                    <div class="stat-label">Current Page</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="itemsPerPage">-</div>
                    <div class="stat-label">Items Per Page</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Search items...">
            <button id="searchBtn" class="btn">Search</button>
            <button id="clearBtn" class="btn">Clear</button>
            <select id="pageSizeSelect" class="btn">
                <option value="60">60 per page</option>
                <option value="120">120 per page</option>
            </select>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Loading items...
        </div>

        <div id="error" class="error" style="display: none;">
            Error loading items
        </div>

        <div id="itemsContainer" class="items-grid">
            <div class="loading">Loading items...</div>
        </div>

        <div id="pagination" class="pagination" style="display: none;"></div>
    </div>

    <script>
        class ItemsManager {
            constructor() {
                this.currentPage = 1;
                this.itemsPerPage = 60;
                this.searchTerm = '';
                this.totalItems = 0;
                this.totalPages = 0;
                
                this.initializeElements();
                this.bindEvents();
                this.loadItems();
            }

            initializeElements() {
                this.searchInput = document.getElementById('searchInput');
                this.searchBtn = document.getElementById('searchBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.pageSizeSelect = document.getElementById('pageSizeSelect');
                this.itemsContainer = document.getElementById('itemsContainer');
                this.pagination = document.getElementById('pagination');
                this.loading = document.getElementById('loading');
                this.error = document.getElementById('error');
                
                // Stats elements
                this.totalItemsEl = document.getElementById('totalItems');
                this.currentPageEl = document.getElementById('currentPage');
                this.itemsPerPageEl = document.getElementById('itemsPerPage');
            }

            bindEvents() {
                this.searchBtn.addEventListener('click', () => this.handleSearch());
                this.clearBtn.addEventListener('click', () => this.handleClear());
                this.pageSizeSelect.addEventListener('change', () => this.handlePageSizeChange());
                this.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleSearch();
                });
            }

            async loadItems() {
                try {
                    this.showLoading();
                    this.hideError();

                    const url = this.buildApiUrl();
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    this.displayItems(data);
                    this.updateStats(data);
                    this.updatePagination();
                } catch (error) {
                    console.error('Error loading items:', error);
                    this.showError('Failed to load items: ' + error.message);
                } finally {
                    this.hideLoading();
                }
            }

            buildApiUrl() {
                const baseUrl = '/osrs/items/with-icons';
                const params = new URLSearchParams({
                    page: this.currentPage.toString(),
                    max_results: this.itemsPerPage.toString()
                });

                if (this.searchTerm) {
                    return `/osrs/items/search-with-icons?query=${encodeURIComponent(this.searchTerm)}&page=${this.currentPage}&max_results=${this.itemsPerPage}`;
                }

                return `${baseUrl}?${params.toString()}`;
            }

            displayItems(data) {
                // Handle both old format (results) and new format (items)
                const items = data.items || data.results || data;
                this.totalItems = data.total || data.count || items.length;
                this.totalPages = Math.ceil(this.totalItems / this.itemsPerPage);

                if (items.length === 0) {
                    this.itemsContainer.innerHTML = '<div class="no-results">No items found</div>';
                    return;
                }

                const itemsHtml = items.map(item => this.createItemCard(item)).join('');
                this.itemsContainer.innerHTML = itemsHtml;
                
                // Ensure the grid styling is applied
                this.itemsContainer.style.display = 'grid';
            }

            createItemCard(item) {
                const examine = item.examine || item.description || 'No description available';
                const iconDataUrl = item.icon_data_url || item.icon_url || '';
                
                return `
                    <div class="item-card">
                        <div class="item-header">
                            <div class="item-icon">
                                ${iconDataUrl ? `<img src="${iconDataUrl}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: contain;">` : '📦'}
                            </div>
                            <div>
                                <div class="item-name">${this.escapeHtml(item.name)}</div>
                                <div class="item-id">ID: ${item.id}</div>
                            </div>
                        </div>
                        <div class="item-details">
                            ${item.members ? '<div class="item-detail"><span class="item-detail-label">Members:</span><span class="item-detail-value">Yes</span></div>' : ''}
                            ${item.tradeable !== undefined ? `<div class="item-detail"><span class="item-detail-label">Tradeable:</span><span class="item-detail-value">${item.tradeable ? 'Yes' : 'No'}</span></div>` : ''}
                            ${item.stackable ? '<div class="item-detail"><span class="item-detail-label">Stackable:</span><span class="item-detail-value">Yes</span></div>' : ''}
                            ${item.noted ? '<div class="item-detail"><span class="item-detail-label">Noted:</span><span class="item-detail-value">Yes</span></div>' : ''}
                            ${item.noteable ? '<div class="item-detail"><span class="item-detail-label">Noteable:</span><span class="item-detail-value">Yes</span></div>' : ''}
                            ${item.equipable ? '<div class="item-detail"><span class="item-detail-label">Equipable:</span><span class="item-detail-value">Yes</span></div>' : ''}
                        </div>
                        <div class="item-examine">${this.escapeHtml(examine)}</div>
                    </div>
                `;
            }

            updateStats(data) {
                this.totalItemsEl.textContent = this.totalItems.toLocaleString();
                this.currentPageEl.textContent = this.currentPage;
                this.itemsPerPageEl.textContent = this.itemsPerPage;
            }

            updatePagination() {
                if (this.totalPages <= 1) {
                    this.pagination.style.display = 'none';
                    return;
                }

                this.pagination.style.display = 'flex';
                
                let paginationHtml = '';
                
                // Previous button
                paginationHtml += `<button onclick="itemsManager.goToPage(${this.currentPage - 1})" ${this.currentPage <= 1 ? 'disabled' : ''}>Previous</button>`;
                
                // Page numbers
                const startPage = Math.max(1, this.currentPage - 2);
                const endPage = Math.min(this.totalPages, this.currentPage + 2);
                
                for (let i = startPage; i <= endPage; i++) {
                    paginationHtml += `<button onclick="itemsManager.goToPage(${i})" class="${i === this.currentPage ? 'active' : ''}">${i}</button>`;
                }
                
                // Next button
                paginationHtml += `<button onclick="itemsManager.goToPage(${this.currentPage + 1})" ${this.currentPage >= this.totalPages ? 'disabled' : ''}>Next</button>`;
                
                this.pagination.innerHTML = paginationHtml;
            }

            goToPage(page) {
                if (page < 1 || page > this.totalPages) return;
                this.currentPage = page;
                this.loadItems();
            }

            handleSearch() {
                this.searchTerm = this.searchInput.value.trim();
                this.currentPage = 1;
                this.loadItems();
            }

            handleClear() {
                this.searchInput.value = '';
                this.searchTerm = '';
                this.currentPage = 1;
                this.loadItems();
            }

            handlePageSizeChange() {
                this.itemsPerPage = parseInt(this.pageSizeSelect.value);
                this.currentPage = 1;
                this.loadItems();
            }

            showLoading() {
                this.loading.style.display = 'block';
                this.itemsContainer.style.display = 'none';
            }

            hideLoading() {
                this.loading.style.display = 'none';
                this.itemsContainer.style.display = 'grid';
            }

            showError(message) {
                this.error.textContent = message;
                this.error.style.display = 'block';
                this.itemsContainer.style.display = 'none';
            }

            hideError() {
                this.error.style.display = 'none';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize the items manager when the page loads
        let itemsManager;
        document.addEventListener('DOMContentLoaded', () => {
            itemsManager = new ItemsManager();
        });
    </script>
</body>
</html>
